name: Release

on:
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: release-main
    cancel-in-progress: false

jobs:
    changes:
        name: Detect product release
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            release: ${{ steps.validate.outputs.release }}
            version: ${{ steps.validate.outputs.version }}

        steps:
            - name: Check out repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Validate release versions
              id: validate
              shell: pwsh
              env:
                  BASE_COMMIT: ${{ github.event.before }}
              run: >-
                  ./.github/scripts/validate-release.ps1
                  -BaseCommit $env:BASE_COMMIT
                  -WriteGitHubOutputs

    obs-build:
        name: Build OBS release
        needs: changes
        if: needs.changes.outputs.release == 'true'
        runs-on: windows-2025
        timeout-minutes: 45

        steps:
            - name: Check out repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Compile and test
              shell: pwsh
              working-directory: obs-plugin
              run: ./scripts/build-windows.ps1

            - name: Package unsigned installer
              shell: pwsh
              working-directory: obs-plugin
              run: ./scripts/build-installer-windows.ps1 -Version "${{ needs.changes.outputs.version }}"

            - name: Stage versioned OBS assets
              shell: pwsh
              run: |
                  $version = '${{ needs.changes.outputs.version }}'
                  New-Item -ItemType Directory -Path release-assets -Force | Out-Null
                  Copy-Item -LiteralPath 'obs-plugin/build_x64/RelWithDebInfo/obs-vscode-privacy-guard.dll' -Destination "release-assets/obs-vscode-privacy-guard-$version.dll"
                  Copy-Item -LiteralPath "obs-plugin/dist/obs-vscode-privacy-guard-setup-$version.exe" -Destination release-assets

            - name: Upload OBS assets
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: product-obs
                  path: release-assets/*
                  if-no-files-found: error
                  retention-days: 7

    vscode-build:
        name: Build VS Code release
        needs: changes
        if: needs.changes.outputs.release == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        defaults:
            run:
                working-directory: vscode-extension

        steps:
            - name: Check out repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: vscode-extension/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Compile and test
              run: npm test

            - name: Package extension
              run: npm run package -- --out "obs-vscode-privacy-guard-${{ needs.changes.outputs.version }}.vsix"

            - name: Upload VS Code asset
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: product-vscode
                  path: vscode-extension/obs-vscode-privacy-guard-${{ needs.changes.outputs.version }}.vsix
                  if-no-files-found: error
                  retention-days: 7

    draft-release:
        name: Create product draft release
        needs:
            - changes
            - obs-build
            - vscode-build
        if: needs.changes.outputs.release == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write

        steps:
            - name: Check out released commit
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Download product assets
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  pattern: product-*
                  merge-multiple: true
                  path: release-assets

            - name: Create or update product draft
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  ./.github/scripts/create-draft-release.ps1 `
                    -Version '${{ needs.changes.outputs.version }}' `
                    -AssetDirectory release-assets

    sync-develop:
        name: Synchronize develop
        needs:
            - changes
            - obs-build
            - vscode-build
            - draft-release
        if: |
            always() &&
            needs.changes.result == 'success' &&
            (needs.obs-build.result == 'success' || needs.obs-build.result == 'skipped') &&
            (needs.vscode-build.result == 'success' || needs.vscode-build.result == 'skipped') &&
            ((needs.changes.outputs.release == 'false' && needs.draft-release.result == 'skipped') ||
             (needs.changes.outputs.release == 'true' && needs.draft-release.result == 'success'))
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: write

        steps:
            - name: Check out released commit
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  ref: ${{ github.sha }}

            - name: Fast-forward develop
              shell: pwsh
              run: ./.github/scripts/sync-develop.ps1
